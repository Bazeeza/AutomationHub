name: Terraform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "AWS-Scripts-Terraform/Scripts-Déploiement-Vaultwarden"
    steps:
      # v5 and later run on Node.js 24; v4 targets Node.js 20, deprecated on the runners
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      # -backend=false: download the AWS provider only, no state and no AWS credentials needed
      - name: Init without backend
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate -no-color
