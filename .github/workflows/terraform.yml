name: Terraform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "AWS-Scripts-Terraform/Scripts-Déploiement-Vaultwarden"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      # -backend=false: download the AWS provider only, no state and no AWS credentials needed
      - name: Init without backend
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate -no-color
