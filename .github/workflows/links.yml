name: Markdown links

on:
  push:
    branches: [main]
    paths: ["**/*.md", ".github/workflows/links.yml"]
  pull_request:
    paths: ["**/*.md", ".github/workflows/links.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --offline: only relative links between files of the repository are checked,
      # so external hosts (screenshots, docs) cannot make the build flaky
      - name: Check relative links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress "./**/*.md"
          fail: true
