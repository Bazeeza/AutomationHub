name: Markdown links

on:
  push:
    branches: [main]
    paths: ["**/*.md", ".github/workflows/links.yml"]
  pull_request:
    paths: ["**/*.md", ".github/workflows/links.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # --offline: only relative links between files of the repository are checked,
      # so external hosts (screenshots, docs) cannot make the build flaky
      - name: Check relative links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress "./**/*.md"
          fail: true
